# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # A new release waits a week before it is proposed, so one that turns out
  # to be compromised is usually withdrawn before it is pinned here.
  - package-ecosystem: "pip"
    directory: "/docs" # requirements.in, and the hash-pinned lock compiled from it
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/" # the workflows pin actions to a commit; this moves the pins
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
