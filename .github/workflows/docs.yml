name: Docs

# Builds the documentation site on every change and publishes it to GitHub
# Pages when the change lands on master. Pull requests get a build check only,
# so a broken page is caught before it ships.
#
# One-time setup: in the repository settings, under Pages, set "Source" to
# "GitHub Actions". The deploy job cannot do that for you.

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push cancels a build that has not
# started deploying yet, but never a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, because a tag can be moved to point
      # at different code after it has been reviewed. Dependabot keeps the
      # commits and the version comments current.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The build runs third-party Python, and nothing in it needs to
          # talk to GitHub, so the token is not left in .git/config for it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        # Every package is pinned by hash, transitive ones included, so what
        # builds the published site is exactly what was reviewed.
        run: pip install --require-hashes -r docs/requirements.txt

      - name: Build
        # --strict turns warnings (broken links, missing pages in nav) into
        # failures, so a typo in a link fails the check instead of shipping.
        run: mkdocs build --strict --verbose

      - name: Upload Pages artifact
        # Nothing consumes it on a pull request, which only needs the check.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Only publish from master. Pull requests stop after the build job, and
    # so does a manual run started from any other branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
